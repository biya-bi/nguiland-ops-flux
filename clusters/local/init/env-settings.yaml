apiVersion: v1
kind: ConfigMap
metadata:
  name: env-settings
  namespace: local
data:
  ENVIRONMENT: local
  ARTIFACTORY_JCR_HOST: artifactory-jcr.local
  IMAGE_REGISTRY_HOST: host.docker.internal:80
  ARTIFACTORY_JCR_PORT: "8082"
  ARTIFACTORY_OSS_HOST: artifactory-oss.local
  ARTIFACTORY_OSS_PORT: "8082"
  ARTIFACTORY_OSS_SCHEME: http
  KEYCLOAK_HOST: keycloak.local
  SKIP_TLS: "true"
