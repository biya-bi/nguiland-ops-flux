apiVersion: v1
kind: ConfigMap
metadata:
  name: env-settings
  namespace: local
data:
  ENVIRONMENT: local
  ARTIFACTORY_JCR_HOST: artifactory-jcr.local
  IMAGE_REGISTRY_HOST: host.docker.internal:80
  OCI_REGISTRY_INSECURE: "true"
  ARTIFACTORY_JCR_PORT: "8082"
  ARTIFACTORY_OSS_HOST: artifactory-oss.local
  ARTIFACTORY_OSS_PORT: "8082"
  ARTIFACTORY_OSS_SCHEME: http
  KEYCLOAK_HOST: keycloak.127.0.0.1.nip.io
  KEYCLOAK_PORT: "80"
  KEYCLOAK_SCHEME: http
  SKIP_TLS: "true"
  POSTGRES_HOST: postgres-rw.local
  POSTGRES_PORT: "5432"
  POSTGRES_SSL_MODE: prefer
  FORGEJO_HOST: forgejo.127.0.0.1.nip.io
  FORGEJO_SCHEME: https
