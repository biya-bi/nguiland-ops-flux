apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capsule
  namespace: ${ENVIRONMENT}
spec:
  interval: 10m
  releaseName: capsule
  targetNamespace: capsule-system
  chart:
    spec:
      chart: capsule
      version: 0.14.*
      sourceRef:
        kind: HelmRepository
        name: capsule
        namespace: ${ENVIRONMENT}
  install:
    createNamespace: true
  upgrade:
    remediation:
      remediateLastFailure: true
  driftDetection:
    mode: enabled
  values:
    crds:
      install: true
    manager:
      options:
        capsuleConfiguration: default
        administrators:
          - kind: ServiceAccount
            name: system:serviceaccount:flux-system:kustomize-controller
