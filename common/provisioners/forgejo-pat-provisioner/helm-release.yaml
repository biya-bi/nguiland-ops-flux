apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-pat-provisioner
  namespace: ${ENVIRONMENT}
spec:
  interval: 10m
  dependsOn:
    - name: forgejo
  chart:
    spec:
      chart: .
      sourceRef:
        kind: GitRepository
        name: forgejo-pat-provisioner
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: forgejo-pat-provisioner
