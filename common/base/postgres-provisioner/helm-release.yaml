apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-provisioner
  namespace: ${ENVIRONMENT}
spec:
  interval: 10m
  dependsOn:
    - name: artifactory-jcr
      namespace: ${ENVIRONMENT}
  chart:
    spec:
      chart: ops/charts/postgres-provisioner
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: oci-registry
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: ${IMAGE_REGISTRY_HOST}/docker-local/ops/apps/postgres-provisioner
