apiVersion: capsule.clastix.io/v1beta2
kind: GlobalTenantResource
metadata:
  name: sops-age
spec:
  tenantSelector:
    matchLabels:
      platform.nguiland.org/sops-age: "true"

  resyncPeriod: 10m

  resources:
    - namespacedItems:
        - apiVersion: v1
          kind: Secret
          name: sops-age
          namespace: ${ENVIRONMENT}
