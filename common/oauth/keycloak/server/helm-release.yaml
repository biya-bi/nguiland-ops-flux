apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: ${ENVIRONMENT}
spec:
  interval: 1h
  releaseName: keycloak
  targetNamespace: ${ENVIRONMENT}
  chart:
    spec:
      chart: keycloakx
      version: 7.4.0
      sourceRef:
        kind: HelmRepository
        name: codecentric
        namespace: ${ENVIRONMENT}
      interval: 1h
  install:
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: keycloak
    replicas: 1
    image:
      repository: quay.io/keycloak/keycloak
      tag: 26.8.2
      pullPolicy: IfNotPresent
    command:
      - /opt/keycloak/bin/kc.sh
    args:
      - start
      - --http-port=8080
    database:
      vendor: postgres
      hostname: postgres-rw
      port: ${POSTGRES_PORT}
    dbchecker:
      enabled: true
    proxy:
      enabled: true
      mode: forwarded
      http:
        enabled: true
    http:
      relativePath: /
      managementRelativePath: /
    extraEnv: |
      - name: KC_HOSTNAME
        value: ${KEYCLOAK_SCHEME}://${KEYCLOAK_HOST}
      - name: KC_BOOTSTRAP_ADMIN_USERNAME
        valueFrom:
          secretKeyRef:
            name: keycloak-admin
            key: username
      - name: KC_BOOTSTRAP_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: keycloak-admin
            key: password
      - name: KC_DB_URL_DATABASE
        valueFrom:
          secretKeyRef:
            name: keycloak-postgres
            key: database
      - name: KC_DB_USERNAME
        valueFrom:
          secretKeyRef:
            name: keycloak-postgres
            key: username
      - name: KC_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: keycloak-postgres
            key: password
    service:
      type: ClusterIP
      httpPort: 80
    ingress:
      enabled: true
      ingressClassName: nginx
      servicePort: http
      rules:
        - host: ${KEYCLOAK_HOST}
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - ${KEYCLOAK_HOST}
          secretName: ${KEYCLOAK_TLS_SECRET}
