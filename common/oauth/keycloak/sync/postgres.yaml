apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-postgres
  namespace: ${ENVIRONMENT}
spec:
  interval: 1m
  path: ./common/oauth/keycloak/postgres
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      inProgress: "!has(status.applied) || (status.applied == true && (!has(status.observedGeneration) || status.observedGeneration != metadata.generation))"
      failed: "has(status.applied) && status.applied == false"
      current: "has(status.applied) && status.applied == true && has(status.observedGeneration) && status.observedGeneration == metadata.generation"
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      inProgress: "!has(status.applied) || (status.applied == true && (!has(status.observedGeneration) || status.observedGeneration != metadata.generation))"
      failed: "has(status.applied) && status.applied == false"
      current: "has(status.applied) && status.applied == true && has(status.observedGeneration) && status.observedGeneration == metadata.generation"
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: postgres
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: env-settings
