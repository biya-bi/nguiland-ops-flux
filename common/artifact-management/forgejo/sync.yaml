apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo
  namespace: ${ENVIRONMENT}
spec:
  interval: 10m
  path: ./common/artifact-management/forgejo
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: keycloak-client-provisioner
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: env-settings
      - kind: ConfigMap
        name: ingress-controller-vars
