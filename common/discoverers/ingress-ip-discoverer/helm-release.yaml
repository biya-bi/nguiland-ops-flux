apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-ip-discoverer
  namespace: ${ENVIRONMENT}
spec:
  interval: 10m
  dependsOn:
    - name: ingress-nginx
  chart:
    spec:
      chart: .
      sourceRef:
        kind: GitRepository
        name: ingress-ip-discoverer
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
