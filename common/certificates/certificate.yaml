apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root-ca
  namespace: ${ENVIRONMENT}
spec:
  isCA: true
  commonName: Root CA
  secretName: root-ca
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  usages:
    - cert sign
    - crl sign
    - digital signature
  issuerRef:
    name: root-ca-bootstrap
    kind: Issuer
    group: cert-manager.io
