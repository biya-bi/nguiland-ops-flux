apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: ${ENVIRONMENT}
spec:
  interval: 1h
  releaseName: cloudnative-pg
  targetNamespace: cnpg-system
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.2
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: ${ENVIRONMENT}
      interval: 1h
  install:
    createNamespace: true
  upgrade:
    crds: CreateReplace
