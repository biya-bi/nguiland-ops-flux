apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../optional
  - ../../databases/postgres/sync.yaml
  - ../../oauth/keycloak/sync.yaml
  - ../../operators/cloudnative-pg/sync.yaml
  - ../../providers/nfs-ganesha

patches:
  - patch: |-
      - op: add
        path: /spec/dependsOn/-
        value:
          name: postgres
          namespace: ${ENVIRONMENT}
    target:
      kind: HelmRelease
      name: artifactory-jcr
  - patch: |-
      - op: add
        path: /spec/dependsOn/-
        value:
          name: postgres
          namespace: ${ENVIRONMENT}
    target:
      kind: HelmRelease
      name: artifactory-oss
  - patch: |-
      - op: add
        path: /spec/dependsOn/-
        value:
          name: postgres
          namespace: ${ENVIRONMENT}
    target:
      kind: HelmRelease
      name: keycloak
