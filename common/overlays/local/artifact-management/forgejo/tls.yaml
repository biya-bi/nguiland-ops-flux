apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: forgejo-tls
  namespace: ${ENVIRONMENT}
spec:
  secretName: forgejo-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - forgejo.127.0.0.1.nip.io
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: root-ca
    kind: Issuer
    group: cert-manager.io
