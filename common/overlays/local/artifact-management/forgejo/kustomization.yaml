apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../artifact-management/forgejo
  - tls.yaml

patches:
  - patch: |-
      - op: replace
        path: /spec/values/ingress/tls/0/secretName
        value: forgejo-tls
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: forgejo
