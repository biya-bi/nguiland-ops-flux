apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: optional-git-repositories
  namespace: ${ENVIRONMENT}
spec:
  interval: 10m
  timeout: 10m
  path: ./common/optional/git-repositories
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: env-settings
