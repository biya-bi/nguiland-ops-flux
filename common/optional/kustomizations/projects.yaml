apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: projects
  namespace: ${ENVIRONMENT}
spec:
  interval: 10m
  timeout: 10m
  dependsOn:
    - name: optional-git-repositories
  path: .
  prune: true
  sourceRef:
    kind: GitRepository
    name: projects
    namespace: ${ENVIRONMENT}
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: env-settings
