apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dependencygraphs.cicd.nguiland.io
spec:
  group: cicd.nguiland.io
  scope: Namespaced
  names:
    plural: dependencygraphs
    singular: dependencygraph
    kind: DependencyGraph
    shortNames:
      - dg
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - project
                - repositories
              properties:
                project:
                  type: string
                  minLength: 1
                repositories:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        minLength: 1
                      dependencies:
                        type: array
                        items:
                          type: string
                          minLength: 1
