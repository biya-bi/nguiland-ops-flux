apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: maven-lib
  namespace: ${ENVIRONMENT}
spec:
  providerRef:
    name: git-event-listener
  inclusionList:
    - "^stored artifact for commit '.*'$"
    - "^no changes since last reconcilation'.*'$"
  eventSeverity: info
  eventMetadata:
    contextDir: .
    project: nguiland
    pipeline: maven-lib
    eventListenerUrl: http://el-maven-lib.${ENVIRONMENT}.svc.cluster.local:8080/
  eventSources:
    - kind: GitRepository
      name: io-utils
    - kind: GitRepository
      name: dependencies
    - kind: GitRepository
      name: web-oauth2
    - kind: GitRepository
      name: ms-parent
    - kind: GitRepository
      name: rest
    - kind: GitRepository
      name: orm
    - kind: GitRepository
      name: dto
