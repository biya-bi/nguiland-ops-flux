apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: ${ENVIRONMENT}
spec:
  instances: 1
  enableSuperuserAccess: true
  superuserSecret:
    name: postgres
  storage:
    size: 10Gi
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      secret:
        name: forgejo-postgres
