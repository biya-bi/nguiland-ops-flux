apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-server-provisioner
  namespace: ${ENVIRONMENT}
spec:
  interval: 30m
  chart:
    spec:
      chart: nfs-server-provisioner
      version: 1.8.0
      sourceRef:
        kind: HelmRepository
        name: nfs-ganesha
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    persistence:
      enabled: true
      storageClass: standard
      size: 50Gi
    storageClass:
      create: true
      name: rwx-storage
      defaultClass: false
      reclaimPolicy: Delete
      allowVolumeExpansion: true
