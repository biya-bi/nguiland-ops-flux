apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: ${ENVIRONMENT}
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 12h
  values:
    defaultSettings:
      defaultReplicaCount: 2
    persistence:
      defaultClass: false
      defaultClassReplicaCount: 2
